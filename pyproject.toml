[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-skill-mcp"
version = "0.0.1"
description = "One MCP server that auto-serves skills to agentic coding tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Rahul Rachhoya" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
keywords = ["mcp", "skills", "ai", "agent", "coding"]
dependencies = [
    "fastmcp>=3.0",
    "scikit-learn>=1.5",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
auto-skill-mcp = "auto_skill_mcp.installer.cli:main"

[project.urls]
Homepage = "https://github.com/RahulRachhoya/auto-skill-mcp"

[tool.setuptools.packages.find]
where = ["src"]
include = ["auto_skill_mcp*"]

[tool.setuptools.package-data]
auto_skill_mcp = ["py.typed", "skill_data/**/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
